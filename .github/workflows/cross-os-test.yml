name: Cross-OS native tests

# By hand only: CI does not run on every push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pmcp-pty and pmcp-tui run their full suites on every shipped platform.
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: pmcp-pty
        working-directory: crates/pmcp-pty
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-fail-fast
      - name: pmcp-tui
        working-directory: crates/pmcp-tui
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-fail-fast

  # The plugins need a pinned Chromium and Xvfb for their integration tests, which stay local;
  # CI holds them to lint and unit tests on Linux.
  plugins:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: |
          for crate in pmcp-plugin-support pmcp-plugin-browser-use pmcp-plugin-computer-use; do
            (cd "crates/$crate" && cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --lib)
          done

  # Windows is not supported yet: every crate must still compile there.
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - shell: bash
        run: |
          for crate in crates/*/; do
            (cd "$crate" && cargo check --locked --all-targets)
          done

  # The TypeScript suite on macOS: the harness and TUI paths that differ from Linux.
  node-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.23.3"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --locked --manifest-path crates/pmcp-pty/Cargo.toml
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: npm run typecheck
      - run: npx vitest run __tests__/harness-terminal.test.ts __tests__/harness-admission.test.ts __tests__/tui-runtime-choice.test.ts
