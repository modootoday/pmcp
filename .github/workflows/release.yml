name: Release

# A v<version> tag publishes to npm after a reviewer approves the "npm" environment. By hand:
# dry-run builds and packs everything, publishes nothing and deletes its draft; bootstrap keeps
# the draft release v<version> with the binaries for a first publish from a maintainer host
# (.github/RELEASING.md). Nothing run by hand publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (nothing kept) or bootstrap (keep the draft release with binaries)
        type: choice
        options: [dry-run, bootstrap]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}

jobs:
  # A draft release carries the binaries between jobs, through the gh CLI the runners ship,
  # so no artifact action has to be trusted. It is deleted after a dry run.
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      # The whole history and its tags: the release notes start at the previous release.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$MODE" = dry-run ]; then version="dry-run-$GITHUB_RUN_ID"; fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The notes come from the commit subjects since the previous published release
      # (scripts/release/notes.mjs). A rehearsal also shows them, with any subject that is not
      # conventional, in the job summary before anything is tagged.
      - name: Release notes
        run: |
          published="$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft | not) | .tagName] | join(",")')"
          to="$GITHUB_SHA"
          if [ "$MODE" = publish ]; then to="$GITHUB_REF_NAME"; fi
          node scripts/release/notes.mjs --to "$to" --published "$published" > notes.md
          if [ "$MODE" != publish ]; then
            node scripts/release/notes.mjs --to "$to" --published "$published" --summary >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Later jobs address the release by the id this step outputs, never by tag name
      # (scripts/release/draft.sh).
      - id: release
        run: bash scripts/release/draft.sh create "${{ steps.tag.outputs.tag }}" notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  binaries:
    needs: draft
    env:
      RELEASE_ID: ${{ needs.draft.outputs.id }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              plugins: true,
            }
          - {
              os: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              plugins: true,
            }
          - { os: macos-15-intel, target: x86_64-apple-darwin, plugins: false }
          - { os: macos-15, target: aarch64-apple-darwin, plugins: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Build
        shell: bash
        run: |
          crates="pmcp-pty pmcp-tui"
          if [ "${{ matrix.plugins }}" = true ]; then crates="$crates pmcp-plugin-browser-use pmcp-plugin-computer-use"; fi
          mkdir -p out
          for crate in $crates; do
            cargo build --locked --release --manifest-path "crates/$crate/Cargo.toml" --target "${{ matrix.target }}"
          done
          for bin in pmcp-pty pmcp-tui pmcp-browser pmcp-desktop; do
            for crate in $crates; do
              path="crates/$crate/target/${{ matrix.target }}/release/$bin"
              if [ -f "$path" ]; then cp "$path" out/; fi
            done
          done
          ls -l out
          tar -C out -czf "${{ matrix.target }}.tar.gz" .
      - shell: bash
        run: bash scripts/release/draft.sh upload "${{ matrix.target }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish:
    needs: [draft, binaries]
    env:
      RELEASE_TAG: ${{ needs.draft.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.23.3"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: npm run build
      - name: Platform packages
        run: |
          bash scripts/release/draft.sh download bins
          for archive in bins/*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            mkdir -p "bins/$target"
            tar -C "bins/$target" -xzf "$archive"
            node scripts/platform-packages.mjs --target "$target" --bin-dir "bins/$target" --out platform
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The main package names the platform packages only in the published manifest, so
      # installs from the repository never reach for versions that are not on npm yet.
      - name: Main package
        run: |
          node scripts/platform-packages.mjs --optional-dependencies > optional.json
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.optionalDependencies={...p.optionalDependencies,...JSON.parse(fs.readFileSync("optional.json"))};fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Pack
        run: |
          mkdir -p packed
          for dir in ./platform/*/; do npm pack "$dir" --pack-destination ./packed; done
          npm pack --pack-destination ./packed
          ls -l packed
      # npm Trusted Publishing: npm exchanges this job's OIDC token (id-token: write) for a
      # short-lived publish credential, so no npm token is stored. It needs npm 11.5.1 or later,
      # and each package's trusted publisher entry on npmjs.com (.github/RELEASING.md).
      # Every mode runs the same publish script: dry-run and bootstrap rehearse it with
      # npm publish --dry-run on the same paths, so a broken publish fails before a tag.
      - name: Publish (rehearsal unless publishing)
        id: publish
        run: |
          npm install --global npm@11.5.1
          bash scripts/release/publish.sh ./packed
      - name: Mark the release published
        if: env.MODE == 'publish' && steps.publish.outputs.published != '0'
        run: bash scripts/release/draft.sh publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # On failure: which packages reached npm, the kept draft, and the recovery command.
      - name: Report what reached npm
        if: failure()
        run: bash scripts/release/report.sh
      # A draft release has no tag ref, so there is no tag to clean up (--cleanup-tag fails with 422).
      - name: Remove the dry-run draft
        if: always() && env.MODE == 'dry-run'
        run: bash scripts/release/draft.sh delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
