[package]
name = "pmcp-index"
version = "0.37.3"
edition = "2024"
license = "Elastic-2.0"
description = "Incremental skill catalog indexer and prompt budget auditor for pmcp"
repository = "https://github.com/modootoday/pmcp"
homepage = "https://pmcp.build"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[profile.release]
opt-level = "s"
lto = "thin"
