[package]
name = "pmcp-plugin-browser-use"
version = "0.19.8"
edition = "2024"
description = "An isolated Chromium for coding agents over MCP, with an address allowlist enforced in Chromium"
publish = false

[[bin]]
name = "pmcp-browser"
path = "src/main.rs"

[dependencies]
pmcp-plugin-support = { path = "../pmcp-plugin-support", features = ["scope", "mcp", "approved"] }
chromiumoxide = { version = "0.9", default-features = false }
futures = "0.3.34"
libc = "0.2.191"
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
