# The fake agent's patterns under four delivery channels, for tests/delivery.rs.
[profiles.fake-claude]
delivery = "claude-inbox"
idle_ms = 300
settle_ms = 150
submit_delay_ms = 50
busy = [{ name = "working", regex = 'esc to cancel' }]
spinner = [{ name = "frames", regex = '^[⠋⠙⠹⠸]' }]
input_empty = [{ name = "prompt", regex = '(?m)^>$' }]
dialogs = [{ name = "exec", regex = 'Allow execution of' }]
input = { name = "prompt", regex = '^>(?: (?P<text>.*))?$' }

