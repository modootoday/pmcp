# Per-runtime screen profiles for pmcp-pty (read from the installed builds).
# Patterns are Rust regexes run against the rendered screen (rows joined by newlines); busy,
# spinner, input and input_empty rows never enter the clean transcript. source names where each
# string was found: a file and line, a byte offset (@n, from grep -abo) in a binary, or a live
# capture (a screen from a live run, kept outside this package). "unverified" marks strings
# not yet seen on a live screen.
# Dialogs whose name starts with auth- are login prompts: no answer policy may ever answer them.
# version is the runtime version the patterns were read from; observe warns when it differs.
# delivery is the turn channel tried first; every profile falls back to screen with guard idle.
#
# Gemini sources: @google/gemini-cli 0.64.0, bundle/interactiveCli-66E5CZDR.js (IC, the chunk
# bundle/gemini-Q2GRYIAK.js imports) and chunk-MA35JFUP.js (MA); citations re-checked P4.

[profiles.default]
idle_ms = 1500
submit_delay_ms = 80

