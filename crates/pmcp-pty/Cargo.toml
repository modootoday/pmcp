[package]
name = "pmcp-pty"
version = "0.22.0"
edition = "2024"
description = "Small PTY host for supervised interactive coding-agent TUIs"
publish = false

[dependencies]
# One copy of the process-tree reap and the approval check, shared with the pmcp plugins.
pmcp-plugin-support = { path = "../pmcp-plugin-support", features = ["approved"] }
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
toml = "1.1.8"
vt100 = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"

[profile.release]
opt-level = "s"
lto = "thin"
